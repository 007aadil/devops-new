name: Full DevOps Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Login to DockerHub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    - name: Build Image
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/devops-app .

    - name: Push Image
      run: docker push ${{ secrets.DOCKER_USERNAME }}/devops-app

    - name: Deploy to EC2
      uses: appleboy/ssh-action@v0.1.6
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}
        script: |
          docker stop devops-app || true
          docker rm devops-app || true
          docker pull ${{ secrets.DOCKER_USERNAME }}/devops-app
          docker run -d -p 3000:3000 --name devops-app ${{ secrets.DOCKER_USERNAME }}/devops-app